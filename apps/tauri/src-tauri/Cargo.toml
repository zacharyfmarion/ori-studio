[package]
name = "ori-studio"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Native desktop runs the fold with rayon-parallel condition generation.
oristudio-cp = { workspace = true, features = ["parallel"] }
# Native CP detection: the decoder, the exact solver, and the FOLD reader the
# solve input comes from — the same crates the wasm worker wraps.
oristudio-cp-detect = { path = "../../../crates/oristudio-cp-detect" }
oristudio-cp-compiler = { path = "../../../crates/oristudio-cp-compiler" }
treemaker-fold = { path = "../../../crates/treemaker-fold" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

# Desktop only. The updater replaces the running application, which has no
# meaning on mobile, and `tauri-plugin-updater` does not build for those targets.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
# `relaunch()` after the update installs. Separate plugin from the updater.
tauri-plugin-process = "2"

# Windows and Linux only. macOS enforces one instance per .app bundle itself and
# routes a double-clicked document through `RunEvent::Opened`; on the other two a
# second `.osf` would otherwise start a second copy of the app, and the two would
# then race over the window-state plugin's single state file.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# ONNX Runtime for native detection, statically linked from pyke's prebuilt
# binaries (fetched by `ort-sys` at build time — a proxied shell may need
# `HTTPS_PROXY` unset for that download). CoreML on macOS uses the GPU and
# neural engine; elsewhere the CPU provider runs on all cores. `DirectML` on
# Windows is the next step once it has been tried on a Windows machine.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.13" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
