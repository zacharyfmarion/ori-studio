[package]
name = "ori-studio"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Native desktop runs the fold with rayon-parallel condition generation.
oristudio-cp = { workspace = true, features = ["parallel"] }
# Native CP detection: the decoder, the exact solver, and the FOLD reader the
# solve input comes from — the same crates the wasm worker wraps.
oristudio-cp-detect = { path = "../../../crates/oristudio-cp-detect" }
oristudio-cp-compiler = { path = "../../../crates/oristudio-cp-compiler" }
treemaker-fold = { path = "../../../crates/treemaker-fold" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

# Desktop only. The updater replaces the running application, which has no
# meaning on mobile, and `tauri-plugin-updater` does not build for those targets.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
# `relaunch()` after the update installs. Separate plugin from the updater.
tauri-plugin-process = "2"
# The updater plugin's HTTP client, named here for two reasons. `system-proxy`
# makes it honour the operating system's proxy settings (the Windows registry,
# macOS System Settings) the way the webview already does; without it a machine
# behind a configured proxy connects straight out, and every update check fails
# while every other request the app makes succeeds. Cargo unifies features, so
# naming it here turns it on inside the plugin. And `updater.rs` needs the error
# type to say *why* a check failed — the plugin only ever reports the message.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
# The plugin's publish-date type, formatted the way its own check command does.
time = { version = "0.3", features = ["formatting"] }

# Windows and Linux only. macOS enforces one instance per .app bundle itself and
# routes a double-clicked document through `RunEvent::Opened`; on the other two a
# second `.osf` would otherwise start a second copy of the app, and the two would
# then race over the window-state plugin's single state file.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# ONNX Runtime for native detection, statically linked from pyke's prebuilt
# binaries (fetched by `ort-sys` at build time — a proxied shell may need
# `HTTPS_PROXY` unset for that download). CoreML on Apple Silicon uses the GPU
# and neural engine; elsewhere the CPU provider runs on all cores. `DirectML` on
# Windows is the next step once it has been tried on a Windows machine.
#
# Intel macOS and Linux are deliberately absent, for two different reasons that
# build.rs sets out in full: Intel macOS has no prebuilt to download at all, and
# the Linux prebuilts want a newer libstdc++ than the release image carries.
# Both keep every other native command — the model store and the exact solver
# are pure Rust — and take their inference from the wasm worker, the same one
# the web uses. The `native_onnx` cfg in build.rs mirrors this gate exactly;
# change one, change the other.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
