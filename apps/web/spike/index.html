<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CP WebGL Phase 0 Spike</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0d0f14; color: #e8eaed;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { position: fixed; inset: 0; }
      #gl { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
      #hud { position: fixed; top: 12px; left: 12px; padding: 12px 14px;
        background: rgba(16,18,24,0.82); border: 1px solid #2a2f3a; border-radius: 10px;
        backdrop-filter: blur(6px); pointer-events: none; min-width: 240px; }
      #hud .row { white-space: nowrap; }
      #hud .big { font-size: 26px; font-weight: 700; margin: 2px 0 6px; }
      #hud .ok { color: #4ade80; }
      #hud .bad { color: #f87171; }
      #hud .muted { color: #8a90a0; }
      #hud b { color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="hud">booting…</div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
