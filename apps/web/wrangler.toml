name = "oristudio"
compatibility_date = "2026-08-03"
pages_build_output_dir = "./dist"

# Bindings for crease-pattern share links (see
# implementation-plans/cp-share-links.md).
#
# The ids below are placeholders. Real namespaces must be created against the account
# and the ids pasted in, or the bindings configured in the Cloudflare Pages dashboard:
#
#   npx wrangler@4 kv namespace create SHARE_KV
#   npx wrangler@4 kv namespace create SHARE_KV --preview
#   npx wrangler@4 r2 bucket create oristudio-cp-thumbnails
#   npx wrangler@4 r2 bucket create oristudio-cp-thumbnails-preview
#
# The thumbnail buckets need a **lifecycle rule expiring objects after 365 days**. That
# is what turns unbounded R2 growth into a bounded steady state; the crease patterns in
# KV are kept indefinitely and deliberately carry no TTL. Lifecycle rules are configured
# per bucket in the dashboard or via `wrangler r2 bucket lifecycle add`, not here.
#
# Rate limiting is a KV counter rather than the platform `ratelimits` binding, because
# `ratelimits` is not among the bindings Pages Functions supports. See
# `functions/_lib/cpShare.ts`.

[[kv_namespaces]]
binding = "SHARE_KV"
id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "SHARE_R2"
bucket_name = "oristudio-cp-thumbnails"

[[env.preview.kv_namespaces]]
binding = "SHARE_KV"
id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[[env.preview.r2_buckets]]
binding = "SHARE_R2"
bucket_name = "oristudio-cp-thumbnails-preview"
