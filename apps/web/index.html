<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the app paint under the rounded corners and the
         home indicator; `env(safe-area-inset-*)` (see theme.css `--safe-*`) is what
         keeps the chrome out of them. Deliberately no `maximum-scale` or
         `user-scalable=no`: those stop iOS zooming a focused field, but they also
         kill pinch-zoom for everyone. The field sizes in the coarse-pointer layer
         are the fix instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Ori Studio is a free, open-source workspace for origami design: draw and edit crease patterns, design from a tree structure or a box-pleating grid, and fold the result in the simulator. Runs in the browser, nothing to install."
    />
    <!--
      Canonical is `/`, not `/welcome`. The router redirects `/` to `/welcome`
      client-side, so both hold the landing page; pointing every copy at `/`
      consolidates them onto the one URL worth ranking. `/welcome` inherits this
      tag, which is what makes the duplicate fold in rather than compete.
    -->
    <link rel="canonical" href="https://oristudio.dev/" />
    <!-- Small first, and no `/favicon.png` in the list: that file is a 1024px
         PNG weighing 2.2MB, which every tab was downloading to draw a 16px
         icon. It stays in `public/` — the Help dialog renders it deliberately —
         but nothing fetches it just to open the app. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Overrides the manifest's `icons` on iOS, which is why it is a separate
         file: the manifest icons keep the artwork's transparent corners, and iOS
         composites transparency onto black. This one is opaque and full-bleed
         (see `scripts/gen-pwa-icons.sh`), so iOS's own mask is the only rounding
         that shows. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Honoured from iOS 15 for the status bar, and by Android and desktop
         Chrome for the window chrome. `--bg-primary` from the default dark
         theme; the app has 23 presets and a manifest has room for one colour. -->
    <meta name="theme-color" content="#101417" />
    <!-- Optional since iOS 11.3 for standalone launch, but still what enables
         the standalone status-bar treatment. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ori Studio" />
    <meta property="og:title" content="Ori Studio — origami crease pattern editor and folding simulator" />
    <meta
      property="og:description"
      content="Draw and edit crease patterns, design from a tree structure or a box-pleating grid, and fold the result — in the browser. Opens .cp, .fold, .ori and .bps."
    />
    <meta property="og:url" content="https://oristudio.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://oristudio.dev/og-default.png" />
    <!--
      The share route rewrites all of these per crease pattern (see
      functions/_lib/cpShareHtml.ts). These are the site-wide defaults, and they
      are what a link to the root unfurls as — the root had no image at all.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ori Studio — origami crease pattern editor and folding simulator" />
    <meta
      name="twitter:description"
      content="Draw and edit crease patterns, design from a tree structure or a box-pleating grid, and fold the result — in the browser."
    />
    <meta name="twitter:image" content="https://oristudio.dev/og-default.png" />
    <title>Ori Studio — free online origami crease pattern editor and folding simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
