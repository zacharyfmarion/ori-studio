[package]
name = "oristudio-bp-wasm"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Not the workspace GPL default: this wrapper reaches only `oristudio-bp`, so it
# carries the Box Pleating Studio lineage's MIT instead. See LICENSING.md.
license = "MIT"
description = "wasm-bindgen package for the Box Pleating Studio-compatible kernel"
repository.workspace = true
homepage.workspace = true
keywords = ["origami", "box-pleating", "wasm"]
categories = ["wasm", "algorithms"]
include = ["Cargo.toml", "src/**", "tests/**", "!pkg/**"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oristudio-bp.workspace = true
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
