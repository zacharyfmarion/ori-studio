[package]
name = "oristudio-cp"
version.workspace = true
publish.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Oriedita-compatible crease-pattern editing kernel for Ori Studio"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["origami", "crease-pattern", "fold", "oriedita"]
categories = ["algorithms", "data-structures", "mathematics"]
include = ["Cargo.toml", "README.md", "resources/**", "src/**", "tests/**"]

[lints]
workspace = true

[features]
# Opt-in, coarse fold-estimation counters for perf diagnosis. No-op when off.
fold-profiling = []
# Parallelize fold-estimation hot loops with rayon (native builds only; the wasm
# path always stays sequential via a `target_arch` guard). Enabled by the Tauri
# desktop crate.
parallel = ["dep:rayon"]

[dependencies]
# Share-link codec. Both are pure Rust and already in the workspace lockfile via
# `zip -> flate2`, so they add no new external dependency and build clean for
# `wasm32-unknown-unknown`. `miniz_oxide` is used directly rather than through
# `flate2` to keep the raw-DEFLATE path free of backend selection.
crc32fast = "1.4"
miniz_oxide = "0.8"
encoding_rs.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
treemaker-fold.workspace = true

[dev-dependencies]
serde_json.workspace = true
# `examples/rendered_corpus.rs` draws crease patterns the way the editor's
# export does, to make benchmark cases out of native files.
image.workspace = true
imageproc.workspace = true
# The Flat-Folder port, used by `tests/folding3d_census.rs` as the independent
# oracle for the ordering-variable count on an all-180 document. It depends only
# on `treemaker-fold`, so there is no cycle.
treemaker-flatfold.workspace = true
