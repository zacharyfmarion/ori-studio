[package]
name = "oristudio-precrease-wasm"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Not the workspace GPL default: this wrapper reaches only `oristudio-precrease`,
# original work with no dependency edge to the TreeMaker port and no code ported
# from ReferenceFinder, so it carries the same MIT OR Apache-2.0. See LICENSING.md.
license = "MIT OR Apache-2.0"
description = "wasm-bindgen package for Ori Studio's precrease planner geometry"
repository.workspace = true
homepage.workspace = true
keywords = ["origami", "crease-pattern", "wasm"]
categories = ["wasm", "algorithms"]
include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**",
    "tests/**",
    "!pkg/**",
]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oristudio-precrease.workspace = true
console_error_panic_hook.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
