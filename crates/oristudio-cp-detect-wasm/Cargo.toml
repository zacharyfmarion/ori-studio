[package]
name = "oristudio-cp-detect-wasm"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Not the workspace GPL default: this wrapper reaches only the detection crates,
# which are themselves permissive.
license = "MIT OR Apache-2.0"
description = "wasm-bindgen package for browser crease-pattern detection"
repository.workspace = true
homepage.workspace = true
keywords = ["origami", "crease-pattern", "wasm", "detection"]
categories = ["wasm", "algorithms"]
include = ["Cargo.toml", "src/**", "tests/**", "!pkg/**"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook.workspace = true
# Already in the graph transitively via oristudio-cp-detect; named directly so
# the browser can call `solve_exact` on a hand-edited `ExactSolveInput` without
# a re-export shim in the detect crate.
oristudio-cp-compiler.workspace = true
oristudio-cp-detect.workspace = true
oristudio-cp-detect-inspector = { path = "../oristudio-cp-detect-inspector" }
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
