[package]
name = "oristudio-cp-wasm"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Not the workspace GPL default: this wrapper reaches only `oristudio-cp` and
# `treemaker-fold`, so it matches their terms. See LICENSING.md.
license = "MIT OR Apache-2.0"
description = "wasm-bindgen package for the Ori Studio Oriedita-compatible crease-pattern kernel"
repository.workspace = true
homepage.workspace = true
keywords = ["origami", "oriedita", "crease-pattern"]
categories = ["wasm", "algorithms"]
include = ["Cargo.toml", "src/**", "tests/**", "!pkg/**"]

[lib]
crate-type = ["cdylib", "rlib"]

# Keep function names in `wasm-pack build --profiling` output so browser
# profiles show real symbols instead of `wasm-function[NNN]`.
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-O2', '-g']

[dependencies]
js-sys.workspace = true
oristudio-cp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
