[package]
name = "oristudio-cp-detect"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Not the workspace GPL default: the detection stack is original work over
# `oristudio-cp*`, and no edge from here reaches the TreeMaker port.
license = "MIT OR Apache-2.0"
description = "Browser crease-pattern detection core types and oracle fixture plumbing"
repository.workspace = true
homepage.workspace = true
keywords = ["origami", "crease-pattern", "wasm", "detection"]
categories = ["algorithms", "wasm"]
include = ["Cargo.toml", "src/**", "tests/**"]

[lints]
workspace = true

[dependencies]
image.workspace = true
imageproc.workspace = true
oristudio-cp-compiler.workspace = true
oristudio-cp-eval.workspace = true
treemaker-fold.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Native-only: drives the data-parallel sample loop in the
# compare_exact_solve_benchmark binary. Excluded from wasm32 builds so the
# browser detector crate stays wasm-safe.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

# Browser-only: `std::time::Instant` panics on wasm32-unknown-unknown, so
# `decode::StageTimer` reads `Date.now()` there. Same setup as
# `oristudio-cp-compiler`, whose solver deadline has the identical problem.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

# Native inference for the batch evaluation example, off by default so no
# build, test or clippy run in CI links ONNX Runtime: `cargo test --workspace`
# skips an example whose required feature is not enabled. The desktop shell
# is the product's native path; `examples/detect_folder.rs` mirrors its
# session and tensor plumbing to run the same pipeline over a folder.
[features]
native-inference = ["dep:ort"]

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["coreml"], optional = true }

[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true }

[[bin]]
name = "curated_benchmark"
required-features = ["native-inference"]

[[example]]
name = "detect_folder"
required-features = ["native-inference"]

[dev-dependencies]
serde_json.workspace = true
