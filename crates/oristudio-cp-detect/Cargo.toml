[package]
name = "oristudio-cp-detect"
version.workspace = true
publish.workspace = true
edition.workspace = true
# Not the workspace GPL default: the detection stack is original work over
# `oristudio-cp*`, and no edge from here reaches the TreeMaker port.
license = "MIT OR Apache-2.0"
description = "Browser crease-pattern detection core types and oracle fixture plumbing"
repository.workspace = true
homepage.workspace = true
keywords = ["origami", "crease-pattern", "wasm", "detection"]
categories = ["algorithms", "wasm"]
include = ["Cargo.toml", "src/**", "tests/**"]

[dependencies]
image.workspace = true
imageproc.workspace = true
oristudio-cp-compiler.workspace = true
oristudio-cp-eval.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Native-only: drives the data-parallel sample loop in the
# compare_exact_solve_benchmark binary. Excluded from wasm32 builds so the
# browser detector crate stays wasm-safe.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[dev-dependencies]
serde_json.workspace = true
