[package]
name = "oristudio-pdf"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
description = "Ori Studio's diagram pages as one print-ready PDF: composed page SVGs through usvg, krilla-svg and krilla"
repository.workspace = true
homepage.workspace = true
keywords = ["origami", "pdf", "svg"]
categories = ["graphics"]
include = ["Cargo.toml", "src/**", "tests/**"]

[lints]
workspace = true

[dependencies]
# Pinned: the Phase 0 spike measured these exact versions (fidelity, sizes,
# determinism native against wasm). A bump is a re-measure, not a routine update.
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
krilla-svg = "=0.8.1"
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
thiserror.workspace = true
