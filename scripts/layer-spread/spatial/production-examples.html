<!doctype html>
<meta charset="utf-8">
<title>Ori Studio · 3D spread examples</title>
<style>
body{font:15px system-ui;background:#f6f6f5;color:#232323;margin:24px}header{max-width:1050px}main{display:flex;gap:24px;flex-wrap:wrap}figure{margin:24px 0}canvas,img{width:480px;height:480px;background:white;border:1px solid #ddd;border-radius:8px}select,button,input{font:inherit;margin:8px}pre{white-space:pre-wrap}figcaption{margin:10px 0}
</style>
<header><h1>3D spread · production renderer</h1><p>Drag the left view to orbit. These examples use the application’s Rust/WASM solve, material mesh, GPU visibility and settled vector capture. They are exploded drawings; spread does not guarantee collision-free paper.</p>
<select id="model"><option value="strip">Joined strip</option><option value="waterbomb">Waterbomb</option><option value="three-plane">Three-plane stacks</option><option value="spikes">Spikes</option><option value="penguin">Penguin</option><option value="pangolin">Pangolin</option><option value="tortoise">Tortoise</option><option value="cylinder">Kirigami cylinder</option><option value="rectangles">Separated rectangles</option><option value="airplane">Unknown-order refusal</option></select>
<label>Spread <input id="amount" type="range" min="0" max="100" value="25"><output id="amount-label">25%</output></label><button id="front">Front</button><button id="back">Back</button><button id="capture">Capture view</button></header>
<main><figure><canvas id="live" width="480" height="480"></canvas><figcaption>Live GPU view</figcaption></figure><figure><img id="captured"><figcaption>Settled capture (same geometry and ordering)</figcaption></figure></main><pre id="result">Preparing…</pre>
<script type="module" src="./production-examples.ts"></script>
