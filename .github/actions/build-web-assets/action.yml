name: Build web assets
description: >-
  The toolchains the web app builds with (Rust with the wasm target, sccache, wasm-pack,
  Emscripten, Node) and what every web job needs before it can typecheck, test or build:
  the simulator package and every wasm bridge under apps/web/src/generated/. Shared by
  CI's web jobs so they cannot drift apart. Check the repository out first.

runs:
  using: composite
  steps:
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-${{ github.repository }}-web-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.repository }}-web-cargo-

    - name: Install wasm-pack
      uses: ./.github/actions/install-wasm-pack

    # ReferenceFinder is C++ compiled with em++ (scripts/build-reference-finder.mjs),
    # so `build:wasm` needs Emscripten beside wasm-pack.
    - name: Install Emscripten SDK
      uses: ./.github/actions/install-emsdk

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install Node dependencies
      shell: bash
      run: npm ci

    # Built once per job. Every later npm step skips the pre-hooks that would rebuild
    # these, with --ignore-scripts.
    - name: Build the simulator and the wasm bridges
      shell: bash
      run: npm --workspace @treemaker/web run build:simulator && npm --workspace @treemaker/web run build:wasm
      env:
        # The ReferenceFinder build may fall back to upstream's committed binary
        # when em++ is missing locally; a CI build must never accept that.
        REFERENCE_FINDER_FORCE_SOURCE: '1'
