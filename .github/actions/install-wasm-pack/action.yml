name: Install wasm-pack
description: Install a prebuilt wasm-pack binary with retries for transient network failures.

inputs:
  version:
    description: wasm-pack version to install.
    required: false
    default: 0.13.1

runs:
  using: composite
  steps:
    - name: Install prebuilt wasm-pack with retry
      shell: bash
      env:
        WASM_PACK_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        target="x86_64-unknown-linux-musl"
        archive="wasm-pack-v${WASM_PACK_VERSION}-${target}"
        url="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}.tar.gz"
        dest="${HOME}/.cargo/bin"
        mkdir -p "${dest}"

        for attempt in 1 2 3; do
          echo "Installing wasm-pack ${WASM_PACK_VERSION} (attempt ${attempt}/3)"
          if curl -fsSL "${url}" -o /tmp/wasm-pack.tar.gz \
            && tar -xzf /tmp/wasm-pack.tar.gz -C /tmp; then
            mv "/tmp/${archive}/wasm-pack" "${dest}/wasm-pack"
            chmod +x "${dest}/wasm-pack"
            wasm-pack --version
            exit 0
          fi

          if [ "${attempt}" -eq 3 ]; then
            echo "wasm-pack install failed after ${attempt} attempts" >&2
            exit 1
          fi

          sleep_seconds=$((attempt * 10))
          echo "wasm-pack install failed; retrying in ${sleep_seconds}s" >&2
          sleep "${sleep_seconds}"
        done
