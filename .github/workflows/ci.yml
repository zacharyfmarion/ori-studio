name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Compile caching. sccache caches individual rustc invocations (deps and, in
  # the web job, unchanged wasm crates) in the GitHub Actions cache, shared
  # across steps and runs. Incremental compilation is incompatible with sccache
  # and is not useful in CI, so it is disabled.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: 0

jobs:
  web-client:
    name: Web client lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ github.repository }}-web-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-web-cargo-

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Build the simulator + wasm crates once. The typecheck/test steps below
      # skip their pre-hooks (which would rebuild these) via --ignore-scripts.
      - name: Build web assets (simulator + wasm)
        run: npm --workspace @treemaker/web run build:simulator && npm --workspace @treemaker/web run build:wasm

      - name: Lint web client
        run: npm run lint:web

      - name: Check i18n translations
        run: npm run i18n:check

      - name: Typecheck web client
        run: npm run typecheck:web --ignore-scripts

      - name: Unit test web client
        run: npm run test:web --ignore-scripts

      # The simulator package ships its own parity and invariant gates (the
      # fixture set, upstream parity, the NaN guards) and nothing ran them, so
      # they protected no release: three of them were failing on a green CI.
      # The build step above already produced its `dist`.
      - name: Unit test simulator package
        run: npm run test:simulator

      # `scripts/*.test.mjs` sits outside every vitest project, so until now
      # nothing ran any of it — five files and 48 assertions, including the only
      # always-available cover for `osf-fold-projection`'s vertex/edge/face
      # renumbering, whose end-to-end guard needs the external corpus. Green
      # there meant nothing was checked and nothing said so.
      - name: Unit test repo scripts
        run: npm run test:scripts

  native-oracle:
    name: Native Rust + C++ oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ github.repository }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-cargo-

      - name: Format
        run: cargo fmt --check

      # Clippy + tests in a single workspace compile. clippy-driver-wrapper.sh is
      # used as RUSTC_WORKSPACE_WRAPPER so workspace crates are linted while being
      # built for the test run, avoiding a separate `cargo clippy` compile.
      - name: Clippy + test workspace
        run: RUSTC_WORKSPACE_WRAPPER="${GITHUB_WORKSPACE}/.github/clippy-driver-wrapper.sh" cargo test --workspace --all-targets

      # --all-targets excludes doctests; run them separately. Reuses the artifacts
      # from the step above (same wrapper), so only crates with doctests rebuild.
      - name: Doctests
        run: RUSTC_WORKSPACE_WRAPPER="${GITHUB_WORKSPACE}/.github/clippy-driver-wrapper.sh" cargo test --workspace --doc

      # The oracle compiles from vendored, effectively-static source, so cache
      # the built binary keyed on that source and skip the build on a hit.
      - name: Cache C++ oracle binary
        id: oracle-cache
        uses: actions/cache@v4
        with:
          path: tools/oracle/build/treemaker-oracle
          key: ${{ runner.os }}-oracle-${{ hashFiles('tools/oracle/treemaker_oracle.cpp', 'tools/oracle/build_oracle.sh', 'third_party/treemaker-5.0.1/Source/**') }}

      - name: Build C++ oracle
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: tools/oracle/build_oracle.sh

      # Same wrapper as above so the already-compiled test binary is reused and
      # this step only re-runs it with the oracle binary wired in.
      - name: C++ oracle parity
        env:
          ORACLE_REQUIRED: TREEMAKER_CPP_ORACLE
        run: RUSTC_WORKSPACE_WRAPPER="${GITHUB_WORKSPACE}/.github/clippy-driver-wrapper.sh" TREEMAKER_CPP_ORACLE=tools/oracle/build/treemaker-oracle cargo test -p oracle-tests --test cpp_oracle --test oracle_env_guard

      # Oriedita is the largest port in the workspace and its parity suites were
      # dormant: they skip on an unset env var, so an unconfigured suite and a
      # passing one looked identical. The oracle compiles a hand-picked source
      # list from the pinned vendored snapshot with plain javac - no maven, no
      # dependency resolution - so this is a JDK and a few seconds.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Oriedita oracle build
        id: oriedita-oracle-cache
        uses: actions/cache@v4
        with:
          path: tools/oriedita-oracle/build
          key: ${{ runner.os }}-oriedita-oracle-${{ hashFiles('tools/oriedita-oracle/build_geometry_oracle.sh', 'tools/oriedita-oracle/src/**', 'tools/oriedita-oracle/stubs/**', 'third_party/oriedita/**') }}

      - name: Build Oriedita oracle
        if: steps.oriedita-oracle-cache.outputs.cache-hit != 'true'
        run: tools/oriedita-oracle/build_geometry_oracle.sh

      # One built wrapper serves every scoped variable; see
      # tools/oriedita-oracle/README.md. ORACLE_REQUIRED turns a missing
      # variable into a failure instead of a silent skip.
      - name: Oriedita oracle parity
        env:
          ORACLE_REQUIRED: ORIEDITA_GEOMETRY_ORACLE,ORIEDITA_OPERATIONS_ORACLE,ORIEDITA_MODEL_ORACLE,ORIEDITA_IO_ORACLE,ORIEDITA_RENDER_ORACLE
          ORIEDITA_GEOMETRY_ORACLE: tools/oriedita-oracle/build/oriedita-geometry-oracle
          ORIEDITA_OPERATIONS_ORACLE: tools/oriedita-oracle/build/oriedita-geometry-oracle
          ORIEDITA_MODEL_ORACLE: tools/oriedita-oracle/build/oriedita-geometry-oracle
          ORIEDITA_IO_ORACLE: tools/oriedita-oracle/build/oriedita-geometry-oracle
          ORIEDITA_RENDER_ORACLE: tools/oriedita-oracle/build/oriedita-geometry-oracle
        run: |
          RUSTC_WORKSPACE_WRAPPER="${GITHUB_WORKSPACE}/.github/clippy-driver-wrapper.sh" \
            cargo test -p oristudio-cp \
              --test oriedita_geometry_oracle \
              --test oriedita_model_oracle \
              --test oriedita_io_oracle \
              --test oriedita_operations_oracle \
              --test oriedita_render_oracle \
              --test oriedita_folding_oracle \
              --test oracle_env_guard

      # The Flat-Folder oracle is a Node script wrapping the vendored JS, so it
      # needs no build. The corpus suite is deliberately not run here: it takes
      # over ten minutes locally, where flat_folder_oracle takes under a second.
      - name: Flat-Folder oracle parity
        env:
          ORACLE_REQUIRED: FLATFOLDER_ORACLE
          FLATFOLDER_ORACLE: tools/flat-folder-oracle/oracle.mjs
        run: RUSTC_WORKSPACE_WRAPPER="${GITHUB_WORKSPACE}/.github/clippy-driver-wrapper.sh" cargo test -p oracle-tests --test flat_folder_oracle --test oracle_env_guard
