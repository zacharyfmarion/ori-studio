name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web
        env:
          # Opts this build into a crawlable robots.txt. Absence means "not production",
          # so PR previews de-index themselves rather than competing with the real site
          # for the same copy. Same absence-is-off firewall as the telemetry below.
          ORI_SITE_ENV: production
          # PostHog analytics config is inlined by Vite at build time. Absent =
          # analytics silently disabled (the dev/prod firewall). Set only here,
          # on the prod (main) deploy — PR previews intentionally leave these
          # unset so preview traffic never reaches the production project.
          #
          # Only the project key is a secret. The ingestion host is a public URL
          # that ships in the client bundle either way, so it lives here as a
          # literal: a missing/misnamed secret resolves to the empty string
          # silently, and that alone is enough to disable analytics entirely.
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          # Ships CP detection: the menu entry and the worker's runtime. The
          # kill switch is removing this line and redeploying. The model itself
          # is not in the build — it comes from R2 through `functions/models/`
          # and is published by `scripts/cp-detect/publish-model.mjs`.
          VITE_CP_DETECT: '1'
          # Sentry crash reporting, same firewall and same reasoning. A DSN is a
          # public value by design — it ships in the bundle and only permits
          # writes — but it lives in secrets to match the PostHog key above, so
          # there is one rule for "telemetry credentials" rather than two.
          VITE_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_PUBLIC_SENTRY_DSN }}
          # Enables sourcemap generation *and* upload, so production stacks are
          # un-minified. Its absence disables both — which is deliberate, and is
          # what keeps PR-preview builds from publishing readable sourcemaps to
          # their public URL. The plugin deletes the maps from `dist` after
          # uploading, so they are never served from here either.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # `initializePostHog` and `initializeSentry` both treat a missing config as
      # "disabled" by design, so a misconfigured prod build deploys green and
      # reports nothing. This is the only place that difference is observable —
      # assert it here rather than discovering it in an empty dashboard weeks
      # later.
      - name: Verify telemetry config was inlined
        run: node scripts/verify-analytics-build.mjs apps/web/dist

      # Run from apps/web so Wrangler discovers `functions/` and `wrangler.toml`, which it
      # resolves relative to its working directory. Deploying `apps/web/dist` from the repo
      # root uploads the static assets and silently skips every Pages Function — the deploy
      # reports success and all the share endpoints 404.
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: apps/web
        run: |
          # Without pipefail, `tee` would swallow a wrangler failure and this step would
          # report the missing URL instead of the deploy error that caused it.
          set -o pipefail
          npx wrangler@4 pages deploy dist --project-name=oristudio --branch=main | tee deploy.log
          url="$(grep -oE 'https://[0-9a-f]{8}\.oristudio\.pages\.dev' deploy.log | head -1)"
          if [ -z "$url" ]; then
            echo "could not read the deployment URL from the wrangler output above" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The deploy above reports success even when it uploads no Functions at all, so
      # nothing before this point can tell a working share feature from a broken one.
      # Read-only checks: no writes against the daily free-tier budget, no junk records.
      #
      # Checked against the per-deployment host, not oristudio.pages.dev: the public
      # hostname keeps serving the previous deployment until this one propagates, so checks
      # against it can pass green without ever touching the build that was just uploaded.
      # `--alias` keeps the public hostname covered, as a reachability probe.
      - name: Verify share endpoints
        run: node scripts/share-smoke.mjs "${{ steps.deploy.outputs.url }}" --alias https://oristudio.dev

      # robots.txt and sitemap.xml are the two files whose absence is invisible: Pages'
      # SPA fallback serves index.html at 200 for both, so a status check calls a missing
      # file a success. This asserts on content type and body instead. Same per-deployment
      # host as the share checks, for the same reason.
      - name: Verify SEO files
        run: node scripts/seo-smoke.mjs "${{ steps.deploy.outputs.url }}"

      # The model store: the registry is served, names a current detector whose
      # manifest is served, and the model's first byte comes back with the
      # headers the page needs. A missing MODELS_R2 binding or an unpublished
      # registry fails here, not in the first user's dialog.
      - name: Verify model store
        run: node scripts/models-smoke.mjs "${{ steps.deploy.outputs.url }}"
