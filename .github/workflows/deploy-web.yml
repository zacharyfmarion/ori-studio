name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web
        env:
          # PostHog analytics config is inlined by Vite at build time. Absent =
          # analytics silently disabled (the dev/prod firewall). Set only here,
          # on the prod (main) deploy — PR previews intentionally leave these
          # unset so preview traffic never reaches the production project.
          #
          # Only the project key is a secret. The ingestion host is a public URL
          # that ships in the client bundle either way, so it lives here as a
          # literal: a missing/misnamed secret resolves to the empty string
          # silently, and that alone is enough to disable analytics entirely.
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com

      # `initializePostHog` treats a missing key or host as "disabled" by design,
      # so a misconfigured prod build deploys green and captures nothing. This is
      # the only place that difference is observable — assert it here rather than
      # discovering it in an empty PostHog dashboard weeks later.
      - name: Verify analytics config was inlined
        run: node scripts/verify-analytics-build.mjs apps/web/dist

      # Run from apps/web so Wrangler discovers `functions/` and `wrangler.toml`, which it
      # resolves relative to its working directory. Deploying `apps/web/dist` from the repo
      # root uploads the static assets and silently skips every Pages Function — the deploy
      # reports success and all the share endpoints 404.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        run: npx wrangler@4 pages deploy dist --project-name=oristudio --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The deploy above reports success even when it uploads no Functions at all, so
      # nothing before this point can tell a working share feature from a broken one.
      # Read-only checks: no writes against the daily free-tier budget, no junk records.
      - name: Verify share endpoints
        run: node scripts/share-smoke.mjs https://oristudio.pages.dev
