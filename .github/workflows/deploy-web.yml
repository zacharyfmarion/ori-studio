name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      # Run from apps/web so Wrangler discovers `functions/` and `wrangler.toml`, which it
      # resolves relative to its working directory. Deploying `apps/web/dist` from the repo
      # root uploads the static assets and silently skips every Pages Function — the deploy
      # reports success and all the share endpoints 404.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        run: npx wrangler@4 pages deploy dist --project-name=oristudio --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
