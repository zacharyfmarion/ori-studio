name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: deploy-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  classify:
    name: Classify Preview Requirement
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.classify.outputs.should_deploy }}
      preview_url: ${{ steps.classify.outputs.preview_url }}
      skip_reason: ${{ steps.classify.outputs.skip_reason }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              per_page: 100,
            });

            const changedFiles = files.map((file) => file.filename);
            const previewUrl = `https://pr-${pull_number}.oristudio.pages.dev`;

            const isDocsOnly = (filename) =>
              filename === 'README.md' ||
              filename === 'AGENTS.md' ||
              filename === 'PORTING.md' ||
              filename === 'RELEASE.md' ||
              filename.startsWith('docs/') ||
              filename.startsWith('implementation-plans/') ||
              filename === '.github/PULL_REQUEST_TEMPLATE.md';

            const isDesktopOnly = (filename) =>
              filename.startsWith('apps/tauri/') ||
              filename.endsWith('.tauri.spec.ts');

            let shouldDeploy = false;
            let skipReason = 'No web preview-relevant files changed.';

            if (context.payload.pull_request.head.repo.fork) {
              skipReason = 'Preview deployment is skipped for forked pull requests because required secrets are unavailable.';
            } else if (changedFiles.length === 0) {
              skipReason = 'No changed files were reported on this pull request.';
            } else if (changedFiles.every((filename) => isDocsOnly(filename))) {
              skipReason = 'This pull request only changes docs or implementation plans, so no web preview was deployed.';
            } else if (changedFiles.every((filename) => isDocsOnly(filename) || isDesktopOnly(filename))) {
              skipReason = 'This pull request is desktop-only, so no web preview was deployed.';
            } else {
              shouldDeploy = true;
              skipReason = '';
            }

            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');
            core.setOutput('preview_url', previewUrl);
            core.setOutput('skip_reason', skipReason);
            core.setOutput('changed_files', JSON.stringify(changedFiles));

  deploy:
    name: Deploy Cloudflare PR Preview
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web
        env:
          # Previews carry CP detection too, reading the production registry.
          VITE_CP_DETECT: '1'

      # Capture the immutable per-deployment host so the checks below test *this* upload.
      # The `pr-N` alias is a new hostname on a branch's first deploy and serves
      # inconsistently for a few seconds after it appears; smoke-testing it failed roughly
      # one in ten first deploys on builds that were fine.
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        working-directory: apps/web
        run: |
          # Without pipefail, `tee` would swallow a wrangler failure and this step would
          # report the missing URL instead of the deploy error that caused it.
          set -o pipefail
          npx wrangler@4 pages deploy dist --project-name=oristudio --branch=pr-${{ github.event.pull_request.number }} | tee deploy.log
          url="$(grep -oE 'https://[0-9a-f]{8}\.oristudio\.pages\.dev' deploy.log | head -1)"
          if [ -z "$url" ]; then
            echo "could not read the deployment URL from the wrangler output above" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Also proves the *preview* environment has its own bindings. If `[[env.preview]]` in
      # wrangler.toml does not apply to a branch deploy, this is where that shows up —
      # rather than as a preview quietly writing into the production namespace.
      #
      # `--alias` then waits for the URL the PR comment hands out to resolve, which is the
      # one thing the per-deployment host cannot tell us.
      - name: Verify share endpoints
        run: |
          node scripts/share-smoke.mjs "${{ steps.deploy.outputs.url }}" \
            --alias https://pr-${{ github.event.pull_request.number }}.oristudio.pages.dev

      # Here rather than only on the production deploy, because there the check runs *after*
      # `wrangler pages deploy` — it reports that the live site is broken, it does not stop
      # it. On a preview the same check runs before anything reaches main, which is the
      # difference between a detector and a gate.
      #
      # No false failures on unrelated PRs: every assertion reads the built `dist`, and a PR
      # that does not touch these files produces identical bytes for them.
      - name: Verify SEO files
        run: node scripts/seo-smoke.mjs "${{ steps.deploy.outputs.url }}" --preview

      # The model store, on the same terms: the preview binds the production bucket, and
      # a registry a branch changes is tested here before it is live.
      - name: Verify model store
        run: node scripts/models-smoke.mjs "${{ steps.deploy.outputs.url }}"

  # Fork PRs get a read-only `GITHUB_TOKEN` no matter what `permissions:` above asks for, so
  # posting the comment 403s. The only comment a fork could get is the "skipped, no secrets"
  # notice, which tells the contributor nothing they can act on — and it turned every green
  # fork PR into a red check. Skip the job instead, which reports as skipped rather than failed.
  comment:
    name: Publish Preview Comment
    runs-on: ubuntu-latest
    needs: [classify, deploy]
    if: ${{ always() && !cancelled() && !github.event.pull_request.head.repo.fork }}
    steps:
      - name: Create or update sticky comment
        uses: actions/github-script@v7
        env:
          SHOULD_DEPLOY: ${{ needs.classify.outputs.should_deploy }}
          PREVIEW_URL: ${{ needs.classify.outputs.preview_url }}
          SKIP_REASON: ${{ needs.classify.outputs.skip_reason }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        with:
          script: |
            const marker = '<!-- oristudio-pr-preview -->';
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const shouldDeploy = process.env.SHOULD_DEPLOY === 'true';
            const previewUrl = process.env.PREVIEW_URL;
            const skipReason = process.env.SKIP_REASON;
            const deployResult = process.env.DEPLOY_RESULT || 'skipped';
            const changedFiles = JSON.parse(process.env.CHANGED_FILES || '[]');

            const lines = [marker, '## PR Preview', ''];

            if (shouldDeploy && deployResult === 'success') {
              lines.push('Status: deployed', '', `Preview URL: ${previewUrl}`, `Commit: \`${sha}\``);
            } else if (!shouldDeploy) {
              lines.push('Status: skipped', '', skipReason, `Commit: \`${sha}\``);
            } else {
              lines.push(
                'Status: failed',
                '',
                `Preview deployment did not complete successfully for commit \`${sha}\`.`,
                `Expected preview URL: ${previewUrl}`
              );
            }

            if (changedFiles.length > 0) {
              lines.push('', 'Changed files considered:');
              for (const file of changedFiles) {
                lines.push(`- \`${file}\``);
              }
            }

            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
