name: Feature request
description: Suggest a new tool, workflow, or improvement for Ori Studio.
title: '[Feature]: '
labels: ['feature request']
body:
  - type: markdown
    attributes:
      value: |
        Ideas from people who actually fold are the most valuable input this
        project can get. Describe what you're trying to do — the underlying
        goal matters more than a specific solution.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What would you use this for while designing or folding?
      placeholder: When designing from a reference photo I want to measure the angle between two creases.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A rough idea is fine — you don't need to know how it should be built.
      placeholder: A tool that shows the angle when I hover over a vertex, or select two creases.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Ori Studio?
      options:
        - Crease pattern editor
        - Box-pleating editor
        - TreeMaker / circle packing
        - Import / export / files
        - Something else
    validations:
      required: false
  - type: textarea
    id: prior-art
    attributes:
      label: Does another tool do this well?
      description: Oriedita, Box Pleating Studio, TreeMaker, ReferenceFinder, etc. A screenshot helps.
    validations:
      required: false
